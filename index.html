<title>Alex Colombel — Product Designer</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff; --ink: #0a0a0a; --ink-mid: #888888; --ink-soft: #b5b5b5;
  --border: #ececec; --radius: 14px; --pad: 44px; --col-gap: 68px;
  --sb-w: 376px; --fi: Inter, sans-serif;
  --shot-scale: 90%; --db-gap: 10px;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--fi);
  font-size: 15px; font-weight: 400; line-height: 22px; letter-spacing: -0.15px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
.page {
  height: 100vh; display: flex; align-items: stretch;
  padding: 0 var(--pad); gap: var(--col-gap);
}
.sidebar {
  width: var(--sb-w); flex-shrink: 0;
  display: flex; flex-direction: column;
  padding: var(--pad) 0;
}
.sidebar-logo {
  display: block; height: 56px; width: auto;
  margin-bottom: 28px; flex-shrink: 0;
  cursor: default; user-select: none;
}
.sidebar-logo svg { height: 100%; width: auto; display: block; overflow: visible; }
/* Signature draws itself once on load, then stays put. */
.sig-path { stroke-dasharray: 280; stroke-dashoffset: 280; animation: sig-draw 1.7s cubic-bezier(.65,.05,.36,1) .15s forwards; }
.sig-path--end { stroke-dasharray: 30; stroke-dashoffset: 30; animation: sig-draw-end .45s cubic-bezier(.65,.05,.36,1) 1.55s forwards; }
@keyframes sig-draw     { to { stroke-dashoffset: 0; } }
@keyframes sig-draw-end { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sig-path, .sig-path--end { animation: none; stroke-dashoffset: 0; }
}
.sidebar-bio { font-size: 14px; line-height: 21px; letter-spacing: -0.1px; color: var(--ink); margin-bottom: 28px; }
.bio-cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  font-family: var(--fi); font-size: 13px; font-weight: 500; letter-spacing: -0.1px;
  text-decoration: none; color: var(--ink); background: #f5f5f5;
  padding: 7px 8px 7px 14px; border-radius: 100px;
  transition: background .25s ease, color .25s ease;
  position: relative; align-self: flex-start; overflow: hidden;
}
.bio-cta:hover { background: #2962ff; color: #fff; }
.bio-cta i { font-size: 15px; line-height: 1; }
/* Primary — filled, reads first. Secondary — outlined, quieter. */
.bio-ctas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bio-cta--primary { background: var(--ink); color: #fff; }
.bio-cta--primary:hover { background: #2962ff; color: #fff; }
.bio-cta--ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); padding: 7px 16px; }
.bio-cta--ghost:hover { background: #f0f0f0; color: var(--ink); box-shadow: inset 0 0 0 1px #e2e2e2; }
.bio-cta--ghost .bio-cta-plane { color: #1a1a1a; font-size: 17px; }
.bio-cta-default {
  display: inline-flex; align-items: center; gap: 4px;
  transition: opacity .22s ease, transform .35s cubic-bezier(.34,1.4,.64,1);
}
.bio-cta:hover .bio-cta-default { opacity: 0; transform: translateX(-10px); }
.bio-cta-plane {
  position: absolute; inset: 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; color: #fff;
  opacity: 0; transform: translateX(10px) scale(.8);
  transition: opacity .22s ease, transform .4s cubic-bezier(.34,1.4,.64,1);
  pointer-events: none;
}
.bio-cta:hover .bio-cta-plane { opacity: 1; transform: translateX(0) scale(1); }
@media (prefers-reduced-motion: reduce) {
  .bio-cta-default, .bio-cta-plane { transition: opacity .15s ease; }
  .bio-cta:hover .bio-cta-default { transform: none; }
  .bio-cta:hover .bio-cta-plane { transform: none; }
}
.skills { margin-top: 40px; }
.skills-label { font-size: 14px; font-weight: 600; letter-spacing: -0.15px; color: var(--ink); margin-bottom: 16px; }
.skills-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; row-gap: 14px; }
.skill { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; letter-spacing: -0.1px; color: var(--ink); line-height: 20px; cursor: default; transition: color .25s ease; }
.skill i { font-size: 18px; color: var(--ink); line-height: 1; flex-shrink: 0; display: inline-flex; transition: transform .35s cubic-bezier(.34,1.4,.64,1), color .25s ease; }
.skill:hover { color: var(--ink-mid); }
.skill:hover i { color: var(--ink-mid); transform: scale(1.18) rotate(-6deg); }
@media (prefers-reduced-motion: reduce) {
  .skill i { transition: color .25s ease; }
  .skill:hover i { transform: none; }
}
.sb-carousel {
  margin-top: 36px; overflow: hidden;
  mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
}
.sb-carousel-track {
  display: flex; align-items: center; gap: 10px;
  width: max-content; animation: sbScroll 28s linear infinite;
}
.sb-carousel-track:hover { animation-play-state: paused; }
.sb-wm {
  flex-shrink: 0;
  display: inline-flex; align-items: center;
  opacity: .55; transition: opacity .25s;
}
.sb-wm:hover { opacity: 1; }
.sb-wm--logo img { height: 32px; width: auto; display: block; }
@keyframes sbScroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.doodle-wrap { margin-top: 56px; position: relative; }
.doodle-canvas {
  width: 100%; height: 100px; display: block;
  background: #fafafa; border: 1px dashed var(--border); border-radius: 8px;
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M14.5 1.5l4 4-11 11-5 1 1-5z" fill="%23e7d3b3" stroke="%230a0a0a" stroke-width="1" stroke-linejoin="round"/><path d="M2.5 17.5l1-3.5L6 16.5z" fill="%230a0a0a"/><path d="M13.5 2.5l4 4" stroke="%230a0a0a" stroke-width="1.2"/></svg>') 1 18, crosshair;
  touch-action: none;
  transition: background .2s ease, border-color .2s ease;
}
.doodle-wrap:hover .doodle-canvas { border-color: rgba(39,45,54,.25); }
.doodle-canvas.drawing { background: #fff; border-color: var(--ink-mid); border-style: solid; }
.doodle-hint {
  display: block; margin-top: 6px;
  font-family: Caveat, cursive; font-size: 18px; font-weight: 400;
  color: var(--ink-mid); opacity: .8; letter-spacing: .3px;
  transform: rotate(-2deg); transform-origin: left center;
  text-align: left; padding-left: 10px;
  pointer-events: none; transition: opacity .25s ease;
}
.doodle-wrap.has-drawing .doodle-hint { opacity: 0; }
.doodle-clear {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.9); border: 1px solid var(--border);
  border-radius: 50%; color: var(--ink-mid);
  cursor: pointer; padding: 0;
  opacity: 0; transform: scale(.85);
  transition: opacity .2s ease, transform .2s ease, background .15s ease, color .15s ease;
}
.doodle-wrap.has-drawing .doodle-clear { opacity: 1; transform: scale(1); }
.doodle-clear:hover { background: var(--ink); color: #fff; }
.doodle-clear i { font-size: 12px; line-height: 1; }
.sidebar-footer {
  margin-top: auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; font-size: 13px; color: var(--ink-mid); letter-spacing: -0.1px;
  flex-shrink: 0;
}
.sf-status {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; color: var(--ink-mid); letter-spacing: -0.1px;
  font-variant-numeric: tabular-nums;
}
.sf-icon { font-size: 15px; line-height: 1; color: var(--ink-soft); display: inline-flex; }
.sf-status .sf-sep { color: var(--ink-soft); }
.sf-time { font-variant-numeric: tabular-nums; }
.sf-socials { display: inline-flex; gap: 10px; }
.sf-socials a { display: inline-flex; color: var(--ink-mid); text-decoration: none; transition: color .18s ease; }
.sf-socials a:hover { color: var(--ink); }
.sf-socials a i { font-size: 16px; line-height: 1; }
.main {
  flex: 1; min-width: 0; height: 100%;
  overflow-y: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.main::-webkit-scrollbar { display: none; width: 0; height: 0; }
.stream {
  display: flex; flex-direction: column; gap: 24px;
  padding-top: var(--pad); padding-bottom: 40px;
}
.shot {
  position: relative; cursor: pointer; display: block;
  width: var(--shot-scale); margin-inline: auto;
  border-radius: var(--radius); overflow: hidden; background: #f5f5f5;
  opacity: 0; transform: translateY(10px);
  transition: opacity .5s ease, transform .5s ease;
}
.shot.visible { opacity: 1; transform: translateY(0); }
/* Shots keep their natural aspect — --shot-scale just trims a little width off
   the column so they breathe. Set it to 100% for edge-to-edge. */
.shot img, .shot video { width: 100%; height: auto; display: block; }
.shot-caption {
  position: absolute; left: 14px; bottom: 14px; z-index: 2;
  display: inline-flex; align-items: center;
  font-family: var(--fi); font-size: 13px; font-weight: 500; letter-spacing: -0.1px; line-height: 1;
  padding: 7px 14px;
  border-radius: 8px;
  background: rgba(255,255,255,.92);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: var(--ink); white-space: nowrap;
  max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis;
  transition: opacity .25s ease; pointer-events: none;
  box-shadow: 0 1px 3px rgba(10,10,10,.06);
}
.shot-caption .sep { color: var(--ink-soft); margin: 0 8px; }
.shot-caption .metric { color: #2962ff; font-weight: 600; }
.shot-hover {
  position: absolute; inset: 0;
  background: rgba(10,10,10,.42);
  opacity: 0; transition: opacity .35s cubic-bezier(.22,.61,.36,1);
  pointer-events: none;
}
@media (hover: hover) and (pointer: fine) {
  .shot:hover .shot-hover { opacity: 1; }
}
.shot-btn {
  position: absolute; bottom: 14px; right: 14px; z-index: 3;
  display: inline-flex; align-items: center; gap: 2px;
  font-family: var(--fi); font-size: 13px; font-weight: 500; letter-spacing: -0.1px; line-height: 1;
  color: var(--ink); background: #fff;
  padding: 7px 8px 7px 14px; border-radius: 100px;
  transform: translateY(16px); opacity: 0;
  transition: transform .55s cubic-bezier(.22,.61,.36,1), opacity .4s cubic-bezier(.22,.61,.36,1);
}
@media (hover: hover) and (pointer: fine) {
  .shot:hover .shot-btn { transform: translateY(0); opacity: 1; }
}
/* No hover on touch, so the affordance is just always there — and the tile
   can't get stuck dimmed after a tap. */
@media (hover: none) {
  .shot-btn { transform: none; opacity: 1; }
}
.shot-btn i { font-size: 15px; line-height: 1; }
.detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  /* inset:0 resolves against the LARGE viewport on iOS, so a bottom-anchored
     drawer ends up partly under the URL bar. dvh pins it to what's visible. */
  height: 100vh; height: 100dvh;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}
.detail-overlay.open { pointer-events: all; }
.detail-overlay { overscroll-behavior: contain; }
/* page is frozen behind any open layer — see lockScroll() */
body.is-locked { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; }
.detail-backdrop {
  position: absolute; inset: 0;
  background: rgba(10,10,10,.30);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .28s ease;
}
.detail-overlay.open .detail-backdrop { opacity: 1; }
.detail-panel {
  position: relative;
  width: 100%; max-width: 720px;
  max-height: calc(100vh - 80px);
  max-height: calc(100dvh - 80px);
  background: var(--bg); border-radius: 16px;
  overflow-y: auto; overscroll-behavior: contain;
  transform: scale(.96) translateY(8px); opacity: 0;
  transition: transform .35s cubic-bezier(.22,.61,.36,1), opacity .25s ease;
  scrollbar-width: none;
  box-shadow: 0 24px 60px rgba(10,10,10,.18);
}
.detail-panel::-webkit-scrollbar { display: none; }
.detail-overlay.open .detail-panel { transform: scale(1) translateY(0); opacity: 1; }
.close-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  border: none; background: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-mid); padding: 0;
  transition: color .18s ease;
}
.close-btn:hover { color: var(--ink); }
.close-btn i { line-height: 1; font-size: 22px; }
.detail-body { padding: 28px 36px 0; }
/* Title + close stay pinned while the case study scrolls under them —
   frosted rather than a solid bar, so the content reads through it. */
.detail-header {
  position: sticky; top: 0; z-index: 5;
  margin: -28px -36px 24px; padding: 22px 36px 16px;
  background: rgba(255, 255, 255, .68);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  backdrop-filter: blur(16px) saturate(160%);
}
.detail-title-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
}
.detail-title { font-family: var(--fi); font-size: 26px; font-weight: 600; line-height: 1.2; color: var(--ink); letter-spacing: -.4px; margin: 0; flex: 1; min-width: 0; }
.detail-desc-label { font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mid); margin-bottom: 14px; }
.detail-desc-text { font-size: 15px; line-height: 24px; letter-spacing: -0.1px; color: var(--ink); opacity: .8; margin-bottom: 16px; }
.detail-desc-text:last-of-type { margin-bottom: 0; }
/* ── case-study body: full-width shots, two-ups and prose, in author order.
   One --db-gap drives both the vertical rhythm and the two-up gutter, so the
   space above and below a row matches the space between a pair. ── */
.detail-blocks { margin-top: var(--db-gap); display: flex; flex-direction: column; gap: var(--db-gap); }
.db-figure { margin: 0; }
/* Consecutive screenshots often both end and begin in near-white, so without a
   boundary they read as one overlapping mess. The hairline ring defines where
   each image stops regardless of its content. */
.db-media {
  border-radius: 10px; overflow: hidden; background: #f5f5f5;
  cursor: zoom-in; position: relative; display: block;
  box-shadow: inset 0 0 0 1px rgba(10, 10, 10, .08);
}
.db-media img, .db-media video {
  width: 100%; height: auto; display: block;
  transition: transform .5s cubic-bezier(.22,.61,.36,1), opacity .3s ease;
}
/* Touch browsers latch :hover on tap and never release it, which left an image
   stuck at scale(1.02) and cropped after you closed the lightbox. */
@media (hover: hover) and (pointer: fine) {
  .db-media:hover img, .db-media:hover video { transform: scale(1.02); }
}
/* cached images decode instantly and skip this; only a cold one fades in */
.db-media img:not([data-ready]), .db-media video:not([data-ready]) { opacity: 0; }
.db-media img[data-ready], .db-media video[data-ready] { opacity: 1; }
.db-duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--db-gap); }
.db-duo .db-media img, .db-duo .db-media video { aspect-ratio: 4/3; object-fit: cover; }
.db-caption {
  margin-top: 9px; font-size: 12px; line-height: 18px;
  color: var(--ink-mid); letter-spacing: -0.05px;
}
.db-text-h {
  font-family: var(--fi); font-size: 17px; font-weight: 600;
  letter-spacing: -0.25px; color: var(--ink); margin-bottom: 8px;
}
.db-text p { font-size: 15px; line-height: 24px; letter-spacing: -0.1px; color: var(--ink); opacity: .8; margin-bottom: 12px; }
.db-text p:last-child { margin-bottom: 0; }
.db-text { padding-block: 6px; }

/* ── lightbox: sits above the case-study modal ── */
.lb {
  position: fixed; inset: 0; z-index: 300;
  height: 100vh; height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 64px; overscroll-behavior: contain;
  pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity .28s ease, visibility 0s linear .28s;
}
.lb.open { pointer-events: all; opacity: 1; visibility: visible; transition: opacity .28s ease; }
.lb-backdrop {
  position: absolute; inset: 0; background: rgba(10,10,10,.86);
  opacity: 0; transition: opacity .28s ease; cursor: zoom-out;
}
.lb.open .lb-backdrop { opacity: 1; }
.lb-img {
  position: relative; max-width: 100%; max-height: 100%;
  width: auto; height: auto; display: block; border-radius: 8px;
  transform: scale(.94); opacity: 0;
  transition: transform .34s cubic-bezier(.22,.61,.36,1), opacity .22s ease;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
  touch-action: none; -webkit-user-select: none; user-select: none;
}
.lb.open .lb-img { transform: scale(1); opacity: 1; }
.lb-img[hidden] { display: none; }
.lb.is-zoomed .lb-img { border-radius: 0; cursor: grab; }
.lb.is-zoomed .lb-prev, .lb.is-zoomed .lb-next { opacity: 0; pointer-events: none; }
.lb-hint {
  position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: rgba(255,255,255,.5); pointer-events: none;
  transition: opacity .3s ease;
}
.lb.is-zoomed .lb-hint { opacity: 0; }
.lb-btn {
  position: absolute; z-index: 2; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; cursor: pointer; padding: 0;
  background: rgba(255,255,255,.1); color: #fff;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: background .18s ease, transform .18s ease;
}
.lb-btn:hover { background: rgba(255,255,255,.22); }
.lb-btn i { font-size: 22px; line-height: 1; }
/* On desktop the three controls keep their own absolute positions; the wrapper
   only becomes a real box on mobile. */
.lb-nav { display: contents; }
.lb-nav[hidden] { display: none; }
/* the hint describes touch gestures, so it only belongs on touch */
@media (hover: hover) and (pointer: fine) { .lb-hint { display: none; } }
.lb-close { top: 20px; right: 20px; }
.lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
.lb-prev:hover, .lb-next:hover { transform: translateY(-50%) scale(1.06); }
.lb-btn[hidden] { display: none; }
.lb-count {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: rgba(255,255,255,.75); letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
}
/* Primary CTA stays pinned to the bottom of the panel with no bar behind it —
   equal margin above and below, so at the end of the scroll it sits centred
   between the last block and the panel edge. The button carries its own
   elevation instead of a background strip. */
.detail-cta-wrap {
  position: sticky; bottom: 0; z-index: 5;
  margin: 26px 0 0; padding-bottom: 26px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center;
  pointer-events: none;
}
.detail-cta-wrap > * { pointer-events: auto; }
.detail-cta-wrap .bio-cta--primary { box-shadow: 0 6px 20px rgba(10, 10, 10, .22); }
.detail-cta-secondary {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--fi); font-size: 13px; font-weight: 500; letter-spacing: -0.1px; line-height: 1;
  text-decoration: none; color: var(--ink); background: transparent;
  border: 1px solid var(--border); padding: 7px 14px; border-radius: 100px;
  transition: background .18s ease, border-color .18s ease, color .18s ease;
}
.detail-cta-secondary:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.detail-cta-secondary i { font-size: 15px; line-height: 1; }
.detail-cta-secondary[hidden] { display: none; }
@media (max-width: 900px) {
  body { overflow: auto; }
  :root { --pad: 24px; --col-gap: 0; }
  .page { flex-direction: column; height: auto; padding: var(--pad); gap: 32px; position: relative; }
  .sidebar { width: 100%; height: auto; padding: 0; position: relative; }
  .sidebar-footer {
    margin-top: 28px;
    position: absolute; top: 0; right: 0;
    justify-content: flex-end;
  }
  .sf-status { display: none; }
  .doodle-wrap { display: none; }
  .main { width: 100%; height: auto; overflow: visible; }
  .stream { padding-bottom: 32px; padding-top: 0; }
  .sidebar-bio { margin-bottom: 20px; }
  /* Modal → drawer on mobile */
  .detail-overlay { padding: 0; align-items: flex-end; justify-content: stretch; }
  .detail-panel {
    max-width: none; width: 100%;
    /* dvh tracks the URL bar; vh doesn't, which made the drawer overshoot
       the screen and appear to resize while scrolling */
    max-height: 66vh;
    max-height: 66dvh;
    border-radius: 16px 16px 0 0;
    transform: translateY(100%); opacity: 1;
    transition: transform .42s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 -10px 30px rgba(10,10,10,.16);
  }
  .detail-overlay.open .detail-panel { transform: translateY(0); }
  .detail-body { padding: 24px 20px 0; }
  .detail-title { font-size: 22px; }
  .detail-header { margin: -24px -20px 20px; padding: 18px 20px 14px; }
  .detail-cta-wrap { margin: 22px 0 0; padding-bottom: 22px; }
  :root { --shot-scale: 100%; --db-gap: 18px; }
  .db-duo { grid-template-columns: 1fr; }
  .lb { padding: 16px 16px 76px; }
  /* Side arrows sat on top of the image. On mobile they collapse into a compact
     pill next to the counter, and swiping is the primary way to move. */
  .lb-nav {
    display: flex; align-items: center; gap: 4px;
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 4px; border-radius: 100px;
    background: rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .lb-prev, .lb-next {
    position: static; transform: none; width: 30px; height: 30px;
    background: transparent;
  }
  .lb-prev:hover, .lb-next:hover { transform: none; }
  .lb-prev i, .lb-next i { font-size: 19px; }
  .lb-count {
    position: static; transform: none;
    min-width: 42px; text-align: center; font-size: 11px;
  }
  .lb-hint { bottom: 62px; }
  /* while zoomed the whole bar goes, not just the arrows */
  .lb.is-zoomed .lb-nav { opacity: 0; pointer-events: none; }
  .bio-ctas { width: 100%; }
}

(function initDoodle() {
  const canvas = document.getElementById('doodleCanvas');
  const wrap   = document.getElementById('doodleWrap');
  const clear  = document.getElementById('doodleClear');
  if (!canvas || !wrap) return;
  const ctx = canvas.getContext('2d');
  /* Some privacy settings and extensions make this return null. Without this
     guard the throw would abort the whole script and take the modal, the
     lightbox and the live-content check down with it. */
  if (!ctx) return;
  let drawing = false, last = null, hasStrokes = false;
  /* Faint dot-grid placeholder — like a designer's notebook page. */
  function drawPlaceholder() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    ctx.save();
    ctx.fillStyle = '#0a0a0a';
    ctx.globalAlpha = 0.18;
    const spacing = 12, inset = 8, dotSize = 1;
    for (let x = inset; x <= w - inset; x += spacing) {
      for (let y = inset; y <= h - inset; y += spacing) {
        ctx.beginPath();
        ctx.arc(x, y, dotSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const snapshot = hasStrokes ? canvas.toDataURL() : null;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 2; ctx.strokeStyle = '#0a0a0a';
    if (snapshot) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = snapshot;
    } else if (!hasStrokes) {
      drawPlaceholder();
    }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  function pos(ev) {
    const rect = canvas.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  }
  function clearPlaceholderIfNeeded() {
    if (!hasStrokes) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  canvas.addEventListener('pointerdown', (ev) => {
    drawing = true; canvas.classList.add('drawing');
    canvas.setPointerCapture(ev.pointerId);
    clearPlaceholderIfNeeded();
    last = pos(ev);
    ctx.beginPath();
    ctx.arc(last.x, last.y, 1, 0, Math.PI * 2);
    ctx.fillStyle = '#0a0a0a'; ctx.fill();
    if (!hasStrokes) { hasStrokes = true; wrap.classList.add('has-drawing'); }
  });
  canvas.addEventListener('pointermove', (ev) => {
    if (!drawing) return;
    const p = pos(ev);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  });
  function endStroke() { drawing = false; canvas.classList.remove('drawing'); last = null; }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', endStroke);
  clear.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasStrokes = false;
    wrap.classList.remove('has-drawing');
    drawPlaceholder();
  });
})();

  const D1 = 'M6 36 C 14 14, 26 14, 28 32 C 29 40, 22 42, 20 36 C 18 30, 28 24, 38 28 C 46 31, 50 38, 56 32 C 62 26, 60 14, 52 14 C 46 14, 44 22, 50 26 C 58 30, 70 24, 76 18 C 82 12, 92 16, 88 26 C 84 36, 70 38, 66 32 C 62 26, 70 22, 78 26 C 86 30, 96 36, 108 30', D2 = 'M104 36 C 108 38, 112 36, 114 34';
  const NS = 'http://www.w3.org/2000/svg';
  const probe = document.createElementNS(NS, 'svg');
  probe.setAttribute('width', '0'); probe.setAttribute('height', '0');
  probe.style.cssText = 'position:absolute;opacity:0;pointer-events:none';
  const mk = d => { const el = document.createElementNS(NS, 'path'); el.setAttribute('d', d); probe.appendChild(el); return el; };
  const e1 = mk(D1), e2 = mk(D2);
  document.body.appendChild(probe);
  let L1, L2;
  try { L1 = e1.getTotalLength(); L2 = e2.getTotalLength(); } catch (err) { probe.remove(); return; }
  probe.remove();

  const SIZE = 64, VW = 120, VH = 50;
  const cv = document.createElement('canvas');
  cv.width = cv.height = SIZE;
  const ctx = cv.getContext('2d');
  const p1 = new Path2D(D1), p2 = new Path2D(D2);
  const scale = SIZE / VW, offY = (SIZE - VH * scale) / 2;

  /* Draw takes ~2s, then the finished signature holds for the rest of the
     5s cycle before starting over. */
  const START = 150, MAIN = 1550, TAIL_AT = 1550, TAIL = 450;
  const CYCLE = 5000;
  const DRAW_END = START + MAIN + TAIL;
  const ease = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
  const t0 = performance.now();
  let lastPaint = 0;
  let wasHolding = false;

  function frame(now) {
    const t = (now - t0) % CYCLE;
    /* While the signature sits complete there is nothing new to draw, so stop
       re-encoding the PNG — one final paint, then idle until the next cycle. */
    const holding = t >= DRAW_END;
    if (holding && wasHolding) { requestAnimationFrame(frame); return; }
    wasHolding = holding;

    if (now - lastPaint >= 50 || holding) {
      lastPaint = now;
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.save();
      ctx.translate(0, offY); ctx.scale(scale, scale);
      ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 7;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const a = ease((t - START) / MAIN);
      ctx.setLineDash([L1, L1]); ctx.lineDashOffset = L1 * (1 - a);
      ctx.stroke(p1);
      const b = ease((t - TAIL_AT) / TAIL);
      ctx.setLineDash([L2, L2]); ctx.lineDashOffset = L2 * (1 - b);
      ctx.stroke(p2);
      ctx.restore();
      try { link.href = cv.toDataURL('image/png'); } catch (err) { return; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

const TZ = 'Europe/Paris';
function localHour() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date());
  return parseInt(parts.find(p => p.type === 'hour').value, 10);
}
function updateStatus() {
  const icon = document.getElementById('sfIcon');
  const greet = document.getElementById('sfGreeting');
  const time = document.getElementById('sfTime');
  if (!icon || !greet || !time) return;
  const hour = localHour();
  const daytime = hour >= 6 && hour < 20;
  icon.className = 'sf-icon ' + (daytime ? 'ri-sun-line' : 'ri-moon-clear-line');
  greet.textContent = hour < 6  ? 'Good evening'
                    : hour < 12 ? 'Good morning'
                    : hour < 18 ? 'Good afternoon'
                    :             'Good evening';
  time.textContent = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false
  }).format(new Date());
}
updateStatus();
setInterval(updateStatus, 15000);

/* ═════════ LOAD CONTENT ═════════
   One render, from content.json. The <link rel=preload> in the head starts this
   request during parse, so it overlaps the CSS and font work rather than
   queueing behind it. The fenced fallback above covers the case where the file
   is unreachable — without it a GitHub hiccup would leave a blank page. */
async function loadContent() {
  let data = CONTENT_FALLBACK;
  if (CONTENT_URL) {
    try {
      const res = await fetch(CONTENT_URL, { cache: 'no-cache' });
      if (res.ok) {
        const fresh = await res.json();
        if (fresh && Array.isArray(fresh.projects)) {
          /* dims may predate the live file; keep both so boxes stay reserved */
          fresh.dims = { ...(CONTENT_FALLBACK.dims || {}), ...(fresh.dims || {}) };
          data = fresh;
        }
      }
    } catch (e) { /* offline, blocked, or rate-limited — fallback stands */ }
  }
  CONTENT = data;
  applyContent(data);
  initObserver();
  warmModalImages();
  requestAnimationFrame(() => {
    document.querySelectorAll('.shot').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) el.classList.add('visible');
    });
  });
}

/* Deferred by one microtask so it can't run before the rest of this script has
   finished evaluating. Without it, any path that doesn't await — no repo
   configured, or fetch throwing synchronously — reaches initObserver() while
   its bindings are still in the temporal dead zone, and the page dies. */
Promise.resolve().then(loadContent);

/* Everything behind a modal is fetched during idle time after load, three at a
   time so it never competes with the visible stream. By the time a client opens
   a project the images are already in cache. */
function warmModalImages() {
  const start = () => {
    const urls = [];
    projects.forEach(p => (p.blocks || []).forEach(b => {
      if (b.image && !isVideoSrc(b.image)) urls.push(cdnAt(b.image, 1600));
      (b.images || []).forEach(im => { if (im && !isVideoSrc(im)) urls.push(cdnAt(im, 900)); });
    }));
    if (!urls.length) return;
    let i = 0;
    const next = () => {
      if (i >= urls.length) return;
      const img = new Image();
      img.decoding = 'async';
      img.onload = img.onerror = next;
      img.src = urls[i++];
    };
    for (let lane = 0; lane < 3; lane++) next();
  };
  const kick = () => {
    if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 3000 });
    else setTimeout(start, 1200);
  };
  kick();
}

let shotObserver = null;
function initObserver() {
  /* Without IntersectionObserver the reveal-on-scroll class never lands and the
     shots would stay invisible — so show them all rather than fail closed. */
  if (typeof IntersectionObserver === 'undefined') {
    document.querySelectorAll('.shot').forEach(i => i.classList.add('visible'));
    return;
  }
  const isMobile = window.innerWidth <= 900;
  const root = isMobile ? null : document.getElementById('mainScroll');
  if (shotObserver) shotObserver.disconnect();
  shotObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { root, threshold: .05 });
  document.querySelectorAll('.shot').forEach(i => shotObserver.observe(i));
}
/* first call happens in loadContent(), once there are shots to observe */
window.addEventListener('resize', () => {
  document.querySelectorAll('.shot').forEach(p => p.classList.remove('visible'));
  initObserver();
});

/* ═════════ SCROLL LOCK ═════════
   Freezing the page behind an open layer. Counted, because the lightbox opens
   on top of the modal and closing it must not unfreeze the page underneath.
   iOS ignores overflow:hidden on body, hence position:fixed + restoring
   scrollY by hand. */
let lockCount = 0, lockedY = 0;
const pageScrolls = () => window.matchMedia('(max-width: 900px)').matches;

function lockScroll() {
  if (!pageScrolls()) return;
  if (lockCount++ > 0) return;
  lockedY = window.scrollY || window.pageYOffset || 0;
  document.body.style.top = -lockedY + 'px';
  document.body.classList.add('is-locked');
}

function unlockScroll() {
  if (!lockCount) return;
  lockCount = Math.max(0, lockCount - 1);
  if (lockCount > 0) return;
  document.body.classList.remove('is-locked');
  document.body.style.top = '';
  window.scrollTo(0, lockedY);
}

const overlay  = document.getElementById('detailOverlay');
const backdrop = document.getElementById('detailBackdrop');
const panel    = document.getElementById('detailPanel');
const closeBtn = document.getElementById('detailClose');

/* Every image in the open case study, in reading order — the lightbox pages
   through this list. Rebuilt each time a project opens. */
let lbImages = [], lbIndex = 0;

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Cloudinary serves any size and format off one stored URL — f_auto picks AVIF
   or WebP per browser, c_limit never upscales. Anything else passes through. */
function cdnAt(u, w) {
  if (typeof u !== 'string') return u;
  const marker = u.indexOf('/video/upload/') !== -1 ? '/video/upload/' : '/image/upload/';
  const i = u.indexOf(marker);
  if (i === -1) return u;
  const cut = i + marker.length;
  return u.slice(0, cut) + 'f_auto,q_auto,c_limit,w_' + w + '/' + u.slice(cut);
}

/* ═════════ RENDER FROM CONTENT ═════════ */
function dimsOf(url) {
  const v = (CONTENT.dims || {})[url];
  if (!v) return null;
  const [w, h] = String(v).split('x').map(Number);
  return (w && h) ? [w, h] : null;
}

function renderSkills(c) {
  document.getElementById('skillsGrid').innerHTML = (c.skills || [])
    .map(sk => '<span class="skill"><i class="' + esc(sk.icon) + '"></i>' + esc(sk.label) + '</span>')
    .join('');
}

function renderWordmarks(c) {
  const one = (c.wordmarks || [])
    .filter(w => w.logo)
    .map(w => '<span class="sb-wm sb-wm--logo"><img src="' + esc(w.logo) + '" alt="' + esc(w.name || '') + '"></span>')
    .join('');
  /* duplicated so the marquee can loop seamlessly */
  document.getElementById('wmTrack').innerHTML = one + one;
}

function captionHtml(sh) {
  const caption = (sh.caption || '').trim();
  const metric  = (sh.metric  || '').trim();
  if (!caption && !metric) return '';
  const parts = [];
  if (caption) {
    caption.split(/s*·s*/).filter(Boolean).forEach((seg, i) => {
      if (i > 0) parts.push('<span class="sep">·</span>');
      parts.push(esc(seg));
    });
  }
  if (metric) {
    if (parts.length) parts.push('<span class="sep">·</span>');
    parts.push('<span class="metric">' + esc(metric) + '</span>');
  }
  return '<div class="shot-caption">' + parts.join('') + '</div>';
}

function renderStream(c) {
  const html = (c.stream || []).map((sh, idx) => {
    if (!sh.image) return '';
    const proj = (c.projects || [])[sh.projectIdx];
    const alt = proj ? proj.title : '';
    const wh = dimsOf(sh.image);
    const size = wh ? ' width="' + wh[0] + '" height="' + wh[1] + '"' : '';
    /* first shot is the LCP candidate — everything after it can wait */
    const prio = idx === 0
      ? ' loading="eager" fetchpriority="high" decoding="async"'
      : ' loading="lazy" decoding="async"';
    const media = isVideoSrc(sh.image)
      ? '<video src="' + cdnAt(sh.image, 1600) + '" poster="' + cdnPoster(sh.image, 1600) + '"' + size +
        ' muted loop autoplay playsinline preload="metadata" disablepictureinpicture></video>'
      : '<img src="' + cdnAt(sh.image, 2000) + '" alt="' + esc(alt) + '"' + size + prio + '>';
    return '<div class="shot" data-project="' + (sh.projectIdx || 0) + '">' + media + captionHtml(sh) +
      '<div class="shot-hover"><div class="shot-btn">View more <i class="ri-arrow-right-s-line"></i></div></div></div>';
  }).filter(Boolean).join('');
  document.getElementById('stream').innerHTML = html;
}

function projectsFrom(c) {
  return (c.projects || []).map(p => ({
    client: p.client || '',
    title: p.title || '',
    website: p.website || '',
    desc1: p.desc1 || '',
    desc2: p.desc2 || '',
    blocks: (p.blocks || []).map(b => {
      if (b.type === 'text') {
        if (!(b.heading || '').trim() && !(b.body || '').trim()) return null;
        return { type: 'text', heading: b.heading || '', body: b.body || '' };
      }
      if (b.type === 'duo') {
        const imgs = (b.images || []).filter(Boolean);
        return imgs.length ? { type: 'duo', images: imgs, caption: b.caption || '' } : null;
      }
      if (!b.image) return null;
      const wh = dimsOf(b.image);
      const o = { type: 'image', image: b.image, caption: b.caption || '' };
      if (wh) { o.w = wh[0]; o.h = wh[1]; }
      return o;
    }).filter(Boolean)
  }));
}

function setText(id, value) {
  const el = document.getElementById(id);
  if (el && typeof value === 'string') el.textContent = value;
}
function setHref(id, value) {
  const el = document.getElementById(id);
  if (el && typeof value === 'string') el.href = value;
}
function setCtaLabel(id, label) {
  const el = document.getElementById(id);
  if (!el) return;
  const span = el.querySelector('.bio-cta-default');
  if (span && span.firstChild) span.firstChild.nodeValue = ' ' + label + ' ';
}

function applyContent(c) {
  const subject = (c.ctaSubject || 'Project Enquiry').trim();
  const mailto = 'mailto:' + (c.email || '') + '?subject=' + encodeURIComponent(subject);

  setText('sbBio', c.bio);
  setText('skillsLabel', c.skillsLabel);
  setHref('ctaPrimary', mailto);
  setHref('ctaPrimaryModal', mailto);
  setHref('ctaSecondary', c.telegramUrl);
  setCtaLabel('ctaPrimary', (c.ctaPrimaryLabel || 'Start a project').trim());
  setCtaLabel('ctaPrimaryModal', (c.ctaPrimaryLabel || 'Start a project').trim());
  setCtaLabel('ctaSecondary', (c.ctaSecondaryLabel || 'Quick message').trim());
  setHref('socialX', (c.socials || {}).x);
  setHref('socialLinkedin', (c.socials || {}).linkedin);
  setHref('socialDribbble', (c.socials || {}).dribbble);

  projects = projectsFrom(c);
  renderSkills(c);
  renderWordmarks(c);
  renderStream(c);
}

function isVideoSrc(u) {
  return typeof u === 'string' &&
    (/\/video\/upload\//.test(u) || /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u));
}

/* First frame as a poster so a video box is never blank or black. */
function cdnPoster(u, w) {
  const marker = '/video/upload/';
  const i = typeof u === 'string' ? u.indexOf(marker) : -1;
  if (i === -1) return '';
  const cut = i + marker.length;
  return u.slice(0, cut) + 'so_0,f_auto,q_auto,c_limit,w_' + w + '/' + u.slice(cut).replace(/\.[^.\/]+$/, '.jpg');
}

function mediaHtml(src, alt, w, dims) {
  const i = lbImages.length;
  lbImages.push(cdnAt(src, 2400));
  /* width/height give the browser the aspect ratio up front, so the box is the
     right size before a single byte arrives — no reflow. */
  const sz = (dims && dims.w && dims.h) ? ' width="' + dims.w + '" height="' + dims.h + '"' : '';
  /* Videos carry no chrome at all: muted + loop + playsinline is what lets them
     autoplay inline on iOS, and no controls attribute means no UI. */
  const tag = isVideoSrc(src)
    ? '<video src="' + cdnAt(src, w) + '" poster="' + cdnPoster(src, w) + '"' + sz +
      ' muted loop autoplay playsinline preload="metadata" disablepictureinpicture data-ready></video>'
    : '<img src="' + cdnAt(src, w) + '" alt="' + esc(alt) + '"' + sz + ' decoding="async">';
  return '<div class="db-media" data-lb="' + i + '">' + tag + '</div>';
}

function blocksHtml(p) {
  lbImages = [];
  return (p.blocks || []).map(b => {
    if (b.type === 'text') {
      const paras = String(b.body || '').split(/\n\s*\n/).filter(Boolean)
        .map(t => '<p>' + esc(t).replace(/\n/g, '<br>') + '</p>').join('');
      if (!b.heading && !paras) return '';
      return '<div class="db-text">'
        + (b.heading ? '<div class="db-text-h">' + esc(b.heading) + '</div>' : '')
        + paras + '</div>';
    }
    if (b.type === 'duo') {
      const imgs = (b.images || []).filter(Boolean);
      if (!imgs.length) return '';
      return '<figure class="db-figure"><div class="db-duo">'
        + imgs.map(src => mediaHtml(src, p.title, 900)).join('')
        + '</div>'
        + (b.caption ? '<figcaption class="db-caption">' + esc(b.caption) + '</figcaption>' : '')
        + '</figure>';
    }
    if (!b.image) return '';
    return '<figure class="db-figure">' + mediaHtml(b.image, p.title, 1600, b)
      + (b.caption ? '<figcaption class="db-caption">' + esc(b.caption) + '</figcaption>' : '')
      + '</figure>';
  }).join('');
}

function openProject(idx) {
  const p = projects[idx];
  if (!p) return;
  document.getElementById('dTitle').textContent  = p.title;
  document.getElementById('dDesc1').textContent  = p.desc1;
  document.getElementById('dDesc2').textContent  = p.desc2;
  const blocksEl = document.getElementById('dBlocks');
  blocksEl.innerHTML = blocksHtml(p);
  blocksEl.querySelectorAll('img').forEach(img => {
    if (img.complete && img.naturalWidth) img.setAttribute('data-ready', '');
  });
  /* if a load event is ever missed, reveal anyway rather than stay blank */
  setTimeout(() => blocksEl.querySelectorAll('img:not([data-ready])')
    .forEach(img => img.setAttribute('data-ready', '')), 4000);
  const websiteBtn = document.getElementById('dWebsite');
  if (p.website) {
    websiteBtn.href = p.website;
    websiteBtn.hidden = false;
  } else {
    websiteBtn.removeAttribute('href');
    websiteBtn.hidden = true;
  }
  panel.scrollTop = 0;
  if (!overlay.classList.contains('open')) lockScroll();
  overlay.classList.add('open');

  /* Once this project is open, quietly fetch its zoom-size versions so the
     lightbox opens instantly. Scoped to this project, not the whole site. */
  const warmZoom = () => lbImages.forEach(u => {
    if (isVideoSrc(u)) return;
    const im = new Image(); im.decoding = 'async'; im.src = u;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(warmZoom, { timeout: 2000 });
  else setTimeout(warmZoom, 600);
}
function closeOverlay() {
  if (!overlay.classList.contains('open')) return;
  closeLb();
  overlay.classList.remove('open');
  unlockScroll();
}

document.getElementById('stream').addEventListener('click', e => {
  const shot = e.target.closest('.shot');
  if (shot) openProject(+shot.dataset.project);
});
closeBtn.addEventListener('click', closeOverlay);
backdrop.addEventListener('click', closeOverlay);

/* ── lightbox ── */
const lb      = document.getElementById('lightbox');
const lbImg   = document.getElementById('lbImg');
const lbCount = document.getElementById('lbCount');
const lbPrev  = document.getElementById('lbPrev');
const lbNext  = document.getElementById('lbNext');

const lbVideo = document.getElementById('lbVideo');
const lbHint  = document.getElementById('lbHint');
const lbNav   = document.getElementById('lbNav');

/* ── pinch / double-tap zoom ──
   Landscape shots on a portrait phone render small, so the lightbox needs real
   zoom. Transform-based rather than native pinch, because the lightbox is a
   fixed overlay and the page behind it is locked. Images only — video keeps
   its aspect and doesn't need it. */
let zs = 1, zx = 0, zy = 0;
const MAX_Z = 4;

function applyZoom(animate) {
  lbImg.style.transition = animate ? 'transform .26s cubic-bezier(.22,.61,.36,1)' : 'none';
  lbImg.style.transform = 'translate(' + zx + 'px,' + zy + 'px) scale(' + zs + ')';
  lb.classList.toggle('is-zoomed', zs > 1.01);
}

function clampPan() {
  const w = lbImg.offsetWidth * zs, h = lbImg.offsetHeight * zs;
  const maxX = Math.max(0, (w - window.innerWidth) / 2);
  const maxY = Math.max(0, (h - window.innerHeight) / 2);
  zx = Math.min(maxX, Math.max(-maxX, zx));
  zy = Math.min(maxY, Math.max(-maxY, zy));
}

function resetZoom(animate) {
  zs = 1; zx = 0; zy = 0;
  applyZoom(animate);
  lbImg.style.transition = '';
  lbImg.style.transform = '';
}

/* zoom toward a point so the thing you tapped stays under your finger */
function zoomTo(scale, px, py) {
  const rect = lbImg.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const k = scale / zs;
  zx = (zx - (px - cx)) * k + (px - cx);
  zy = (zy - (py - cy)) * k + (py - cy);
  zs = scale;
  clampPan();
  applyZoom(true);
}

function showLb(i) {
  if (!lbImages.length) return;
  lbIndex = (i + lbImages.length) % lbImages.length;
  const src = lbImages[lbIndex];
  const video = isVideoSrc(src);

  resetZoom(false);
  lbVideo.style.transition = '';
  lbVideo.style.transform = '';
  lbImg.hidden = video;
  lbVideo.hidden = !video;
  if (video) {
    lbImg.removeAttribute('src');
    lbVideo.src = src;
    lbVideo.poster = cdnPoster(src, 1600);
    lbVideo.play().catch(() => {});
  } else {
    lbVideo.pause();
    lbVideo.removeAttribute('src');
    lbImg.src = src;
  }

  const many = lbImages.length > 1;
  lbCount.textContent = many ? (lbIndex + 1) + ' / ' + lbImages.length : '';
  lbPrev.hidden = !many;
  lbNext.hidden = !many;
  lbNav.hidden = !many;
  lbHint.textContent = many
    ? (video ? 'Swipe to browse' : 'Swipe to browse · pinch to zoom')
    : (video ? '' : 'Pinch to zoom');
}
function openLb(i) {
  if (lb.classList.contains('open')) return showLb(i);
  showLb(i);
  lockScroll();
  lb.classList.add('open');
}
function closeLb() {
  if (!lb.classList.contains('open')) return;
  lb.classList.remove('open');
  lb.classList.remove('is-zoomed');
  lbVideo.pause();
  resetZoom(false);
  unlockScroll();
}

/* ── gestures ── */
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const mid  = t => [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2];
let gesture = null, lastTap = 0;

lbImg.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const m = mid(e.touches);
    gesture = { pinch: true, d0: dist(e.touches), s0: zs, mx: m[0], my: m[1] };
  } else if (e.touches.length === 1) {
    const t = e.touches[0];
    gesture = zs > 1.01
      ? { pan: true, x0: t.clientX, y0: t.clientY, zx0: zx, zy0: zy }
      /* only at rest — a swipe while zoomed would fight panning */
      : { swipe: true, x0: t.clientX, y0: t.clientY, dx: 0, axis: null };
    const now = Date.now();
    if (now - lastTap < 300) {
      e.preventDefault();
      zs > 1.01 ? resetZoom(true) : zoomTo(2.6, e.touches[0].clientX, e.touches[0].clientY);
      gesture = null;
      lastTap = 0;
    } else {
      lastTap = now;
    }
  }
}, { passive: false });

lbImg.addEventListener('touchmove', e => {
  if (!gesture) return;
  e.preventDefault();
  if (gesture.pinch && e.touches.length === 2) {
    const scale = Math.min(MAX_Z, Math.max(1, gesture.s0 * (dist(e.touches) / gesture.d0)));
    const k = scale / zs;
    const rect = lbImg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    zx = (zx - (gesture.mx - cx)) * k + (gesture.mx - cx);
    zy = (zy - (gesture.my - cy)) * k + (gesture.my - cy);
    zs = scale;
    clampPan();
    applyZoom(false);
  } else if (gesture.pan && e.touches.length === 1) {
    zx = gesture.zx0 + (e.touches[0].clientX - gesture.x0);
    zy = gesture.zy0 + (e.touches[0].clientY - gesture.y0);
    clampPan();
    applyZoom(false);
  } else if (gesture.swipe && e.touches.length === 1) {
    const dx = e.touches[0].clientX - gesture.x0;
    const dy = e.touches[0].clientY - gesture.y0;
    /* decide once whether this is a horizontal swipe, then commit to it */
    if (!gesture.axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      gesture.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (gesture.axis === 'x' && lbImages.length > 1) {
      gesture.dx = dx;
      lbImg.style.transition = 'none';
      lbVideo.style.transition = 'none';
      const t = 'translate(' + dx * 0.6 + 'px,0)';
      lbImg.style.transform = t;
      lbVideo.style.transform = t;
    }
  }
}, { passive: false });

function endSwipe(g) {
  if (!g || !g.swipe || g.axis !== 'x' || lbImages.length < 2) return false;
  if (Math.abs(g.dx) < 55) return false;
  showLb(lbIndex + (g.dx < 0 ? 1 : -1));
  return true;
}

function onTouchEnd(e) {
  if (e.touches.length !== 0) return;
  const g = gesture;
  gesture = null;
  if (endSwipe(g)) return;
  lbVideo.style.transition = '';
  lbVideo.style.transform = '';
  if (zs <= 1.01) resetZoom(true);
}

lbImg.addEventListener('touchend', onTouchEnd);
lbImg.addEventListener('touchcancel', onTouchEnd);
lbVideo.addEventListener('touchstart', e => {
  if (e.touches.length === 1) gesture = { swipe: true, x0: e.touches[0].clientX, y0: e.touches[0].clientY, dx: 0, axis: null };
}, { passive: true });
lbVideo.addEventListener('touchmove', e => {
  if (!gesture || !gesture.swipe || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - gesture.x0;
  const dy = e.touches[0].clientY - gesture.y0;
  if (!gesture.axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    gesture.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (gesture.axis === 'x' && lbImages.length > 1) {
    e.preventDefault();
    gesture.dx = dx;
    lbVideo.style.transition = 'none';
    lbVideo.style.transform = 'translate(' + dx * 0.6 + 'px,0)';
  }
}, { passive: false });
lbVideo.addEventListener('touchend', onTouchEnd);
lbVideo.addEventListener('touchcancel', onTouchEnd);

/* desktop: double-click toggles, wheel zooms */
lbImg.addEventListener('dblclick', e => {
  e.preventDefault();
  zs > 1.01 ? resetZoom(true) : zoomTo(2.4, e.clientX, e.clientY);
});
lbImg.addEventListener('wheel', e => {
  e.preventDefault();
  const next = Math.min(MAX_Z, Math.max(1, zs * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  next <= 1.01 ? resetZoom(true) : zoomTo(next, e.clientX, e.clientY);
}, { passive: false });

/* delegated so it keeps working after the modal re-renders */
/* mark images ready as they decode, so the fade only applies to cold loads */
document.getElementById('dBlocks').addEventListener('load', e => {
  if (e.target.tagName === 'IMG') e.target.setAttribute('data-ready', '');
}, true);

document.getElementById('dBlocks').addEventListener('click', e => {
  const media = e.target.closest('[data-lb]');
  if (media) openLb(+media.dataset.lb);
});
document.getElementById('lbBackdrop').addEventListener('click', closeLb);
document.getElementById('lbClose').addEventListener('click', closeLb);
lbPrev.addEventListener('click', () => showLb(lbIndex - 1));
lbNext.addEventListener('click', () => showLb(lbIndex + 1));

/* Escape closes the topmost layer first */
document.addEventListener('keydown', e => {
  const lbOpen = lb.classList.contains('open');
  if (e.key === 'Escape') { lbOpen ? closeLb() : closeOverlay(); return; }
  if (!lbOpen) return;
  if (e.key === 'ArrowLeft')  showLb(lbIndex - 1);
  if (e.key === 'ArrowRight') showLb(lbIndex + 1);
});
</script>
</body>
</html>
