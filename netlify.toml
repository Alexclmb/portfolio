# Static site — nothing to build, serve the repo root as-is.
[build]
  publish = "."

  # This is the rule that stops content edits from costing a deploy.
  # Netlify runs it before building: exit 0 cancels the build, non-zero proceeds.
  # A content-only publish from the CMS is skipped (the page reads the freshest
  # content.json straight from this repo), while any other change still deploys.
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)content.json'"

# Keep the editor out of search results.
[[headers]]
  for = "/cms"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
[[headers]]
  for = "/cms/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# content.json is public either way, but should not be indexed or cached hard.
[[headers]]
  for = "/content.json"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=0, must-revalidate"

# The page and its code must never be cached hard, or a publish won't show up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
